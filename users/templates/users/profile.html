{% extends "base.html" %}

{% block title %}
    My Profile
{% endblock %}

{% block content %}
    <h1>
        My Profile
    </h1>

    <div class="card">
        <p>
            <strong>Username: </strong>
            {{ user.username }}
        </p>

        <p>
            <strong>Email: </strong>
            {{ user.email }}
        </p>

        <a href="{% url 'edit_profile' %}" class="button">
            Edit Profile
        </a>

        <a href="{% url 'password_change' %}" class="button">
            Change Password
        </a>
    </div>
{% endblock %}
