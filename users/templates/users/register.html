{% extends "base.html" %}


{% block title %}
    Register
{% endblock %}


{% block content %}

<h1>
    Create an Account
</h1>


<div class="card">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </p>

</div>

{% endblock %}
