{% extends "base.html" %}

{% block title %}
    Change Password
{% endblock %}

{% block content %}
    <h1>
        Change Password
    </h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>

            <a href="{% url 'profile' %}">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
