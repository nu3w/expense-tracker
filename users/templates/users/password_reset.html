{% extends "base.html" %}

{% block title %}
    Reset Password
{% endblock %}

{% block content %}
    <h1>
        Reset Your Password
    </h1>

    <div class="card">
        <p>
            Enter your email address and we will send you instructions to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Send Reset Email
            </button>
        </form>

        <p>
            <a href="{% url 'login' %}">
                Back to Login
            </a>
        </p>
    </div>
{% endblock %}
