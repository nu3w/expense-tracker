{% extends "base.html" %}

{% block title %}
    Edit Profile
{% endblock %}

{% block content %}
    <h1>
        Edit Profile
    </h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Save Changes
            </button>

            <a href="{% url 'profile' %}" class="button">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
