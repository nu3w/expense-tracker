{% extends "base.html" %}

{% load socialaccount %}

{% block title %}
    Login
{% endblock %}


{% block content %}

<h1>
    Login
</h1>


<div class="card">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Login
        </button>

    </form>

    <p>
        <a href="{% url 'password_reset' %}">
            Forgot your password?
        </a>
    </p>

    <hr>

        <form method="POST" action="{% provider_login_url 'google' %}">

            {% csrf_token %} 

            <button type="submit">
                Continue with Google
            </button>

        </form>


    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
