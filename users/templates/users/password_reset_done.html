{% extends "base.html" %}

{% block title %}
    Check Your Email
{% endblock %}

{% block content %}
    <h1>
        Check Your Email
    </h1>

    <div class="card">
        <p>
            If an account exists with the email address you entered, we have sent instructions to reset your password.
        </p>

        <p>
            Please check your email and follow the link.
        </p>

        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </div>
{% endblock %}
